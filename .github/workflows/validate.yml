# Validates the templates with the Monoceros CLI on every push and pull
# request, so a broken file fails there instead of every builder's next init,
# add-service or apply, however the team gets its changes in.
name: Validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version check compares against the base branch.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Monoceros
        run: |
          curl -fsSL https://raw.githubusercontent.com/getmonoceros/workbench/main/installer/install.sh | bash
          # Where the installer puts it when the npm prefix is not writable.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show the Monoceros version
        run: monoceros --version

      - name: Use this checkout as the templates of a Monoceros home
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/home/templates"
          echo "MONOCEROS_HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

      - name: Read every template
        run: .github/scripts/read-templates.sh

      - name: Check service versions
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # A pull request compares with its target branch. A push compares
          # with the state before it; a new branch, or a push whose previous
          # state is gone (force push), with the default branch.
          if [ "$EVENT" = pull_request ]; then
            base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base="origin/$DEFAULT_BRANCH"
          fi
          echo "comparing with $base"
          .github/scripts/check-versions.sh "$base"
